name: Build Nextcloud Docker Container

on: 
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'
  push:
    branches:
      - main
      - master 
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # neueste Major-Version
          - base: apache
            tag: latest
          # Zwischen-Images fuer stufenweise Major-Upgrades (Nextcloud erlaubt nur +1 Major je Schritt)
          - base: 34-apache
            tag: "34"
          - base: 33-apache
            tag: "33"
          - base: 32-apache
            tag: "32"
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      -
        name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v4
        with:
          build-args: NEXTCLOUD_BASE=${{ matrix.base }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: xtralarge71/docker_nextcloud:${{ matrix.tag }}
